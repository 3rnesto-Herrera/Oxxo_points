<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OXXO Points - Eliminar Usuario</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="oxxo-header">
        <div class="logo-container">
            <a href="/">
                <img src="img/logo.png" alt="OXXO Logo" class="oxxo-logo-img">
            </a>
        </div>
        <div class="menu-icon">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </header>
    <div class="yellow-bar"></div>

    <main class="registro-container">
        
        <div class="registro-header-card">
            <h1>Eliminar usuario</h1>
            <p>Ingresa el usuario que se desea eliminar</p>
        </div>

        <form id="eliminarForm" class="registro-form" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
            
            <div class="input-card" style="width: 100%; max-width: 650px;">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" placeholder="Nombre del usuario" required>
            </div>

            <div class="input-card" style="width: 100%; max-width: 650px;">
                <label for="correo">Correo Electronico</label>
                <input type="email" id="correo" placeholder="ejemplo@gmail.com" required>
            </div>

            <div class="form-buttons" style="display: flex; gap: 15px; margin-top: 10px; width: 100%; max-width: 650px; justify-content: space-between;">
                <a href="/registro" class="btn-cancelar" style="flex: 1; text-align: center; text-decoration: none; display: flex; align-items: center; justify-content: center;">Cancelar eliminacion</a>
                <button type="submit" class="btn-realizar" style="flex: 1; background-color: #dc3545; color: #ffffff;">Realizar eliminacion</button>
            </div>

        </form>

    </main>

    <script>
        const eliminarForm = document.getElementById('eliminarForm');

        eliminarForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const correo = document.getElementById('correo').value.trim();

            const regexGmail = /^[a-zA-Z0-9._%+-]+@gmail\.com$/i;
            if (!regexGmail.test(correo)) {
                alert('Solo se permiten direcciones con dominio @gmail.com.');
                return;
            }

            if (!confirm(`¿Estás seguro de eliminar permanentemente el registro de ${correo}?`)) {
                return;
            }

            try {
                const response = await fetch(`/api/eliminar/${encodeURIComponent(correo)}`, {
                    method: 'DELETE'
                });

                const resultado = await response.json();

                if (response.ok && resultado.exito) {
                    alert(`✅ ${resultado.mensaje}`);
                    eliminarForm.reset();
                    window.location.href = '/registro';
                } else {
                    alert(`Error: ${resultado.mensaje}`);
                }
            } catch (error) {
                console.error('Error en la red:', error);
                alert('Hubo un error al conectar con el servidor.');
            }
        });
    </script>

</body>
</html>
