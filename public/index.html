<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OXXO Points - Inicio</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="oxxo-header">
        <div class="logo-container">
            <img src="img/logo.png" alt="OXXO Logo" class="oxxo-logo-img">
        </div>
        <div class="menu-icon">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </header>
    <div class="yellow-bar"></div>

    <main class="main-container">
        
        <section class="left-section">
            <div class="inicio-card">
                <h1>Inicio</h1>
            </div>

            <div class="buttons-grid" style="display: flex; flex-direction: column; gap: 12px;">
                <a href="/compras" class="action-btn" style="text-decoration: none; display: flex; align-items: center; justify-content: center;">Realizar una compra</a>
                <a href="/registro" class="action-btn" style="text-decoration: none; display: flex; align-items: center; justify-content: center;">Realizar un registro</a>
                <a href="/database" class="action-btn" style="text-decoration: none; display: flex; align-items: center; justify-content: center; background-color: #ffde59; color: #000000; font-weight: 700;">Base de Datos (Gerente)</a>
            </div>
        </section>

        <section class="right-section">
            <div class="store-image-container">
                <img src="img/sucursal.jpg" alt="Sucursal OXXO">
            </div>
        </section>

    </main>

</body>
</html>
