<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OXXO Points - Puntos por Compra</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="oxxo-header">
        <div class="logo-container">
            <a href="/">
                <img src="img/logo.png" alt="OXXO Logo" class="oxxo-logo-img">
            </a>
        </div>
        <div class="menu-icon">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </header>
    <div class="yellow-bar"></div>

    <main class="compra-main-container">
        
        <div class="compra-header-card">
            <h1>Puntos por compra</h1>
            <p>Entrega y redención de puntos OXXO</p>
        </div>

        <div class="compra-grid-layout">
            
            <div class="compra-left-column">
                
                <div class="info-card-box selector-producto-box">
                    <h3>Seleccionar Artículo</h3>
                    <div class="selector-controls">
                        <select id="productoSelect">
                            <option value="Coca-cola|25">Coca-cola - $25</option>
                            <option value="Halls menta|12">Halls menta - $12</option>
                            <option value="Gansito|10">Gansito - $10</option>
                            <option value="Agua|15">Agua - $15</option>
                            <option value="Doritos|20">Doritos - $20</option>
                        </select>
                        <button type="button" id="btnAddItem" class="btn-add">Añadir</button>
                    </div>
                </div>

                <div class="info-card-box">
                    <h3>Artículos a comprar</h3>
                    <div id="listaArticulosContainer"></div>
                    <div class="ticket-item total-row">
                        <span>Total</span>
                        <span id="totalMonto">0$</span>
                    </div>
                </div>

                <div class="info-card-box">
                    <h3>Información de Puntos</h3>
                    <p class="puntos-texto" id="infoPuntosTexto">Ingresa un correo registrado para ver tus puntos disponibles.</p>
                </div>

            </div>

            <div class="compra-right-column">
                
                <div class="input-card-correo">
                    <label for="correoCliente">Correo del Cliente</label>
                    <input type="email" id="correoCliente" name="correoCliente" placeholder="Ingresa el correo para abonar/pagar">
                </div>

                <!-- Opción para pagar con puntos -->
                <div class="input-card-correo" style="display: flex; align-items: center; gap: 10px; margin-top: 15px; background: #fff; padding: 12px; border-radius: 8px;">
                    <input type="checkbox" id="checkPagarPuntos" style="width: 20px; height: 20px; cursor: pointer;">
                    <label for="checkPagarPuntos" style="margin: 0; cursor: pointer; font-weight: 600; color: #333;">Pagar compra con Puntos (1 pt = $1)</label>
                </div>

                <button type="button" class="compra-action-btn" id="btnTerminarCompra">
                    Terminar compra
                </button>
                
                <a href="/" class="compra-action-btn btn-regresar-link" style="text-decoration: none; display: flex; align-items: center; justify-content: center;">
                    Regresar
                </a>
            </div>

        </div>

    </main>

    <script>
        let carrito = [];
        let puntosDisponiblesCliente = 0;

        const productoSelect = document.getElementById('productoSelect');
        const btnAddItem = document.getElementById('btnAddItem');
        const listaArticulosContainer = document.getElementById('listaArticulosContainer');
        const totalMontoElem = document.getElementById('totalMonto');
        const infoPuntosTexto = document.getElementById('infoPuntosTexto');
        const btnTerminarCompra = document.getElementById('btnTerminarCompra');
        const correoCliente = document.getElementById('correoCliente');
        const checkPagarPuntos = document.getElementById('checkPagarPuntos');

        btnAddItem.addEventListener('click', () => {
            const [nombre, precioStr] = productoSelect.value.split('|');
            const precio = parseFloat(precioStr);

            const indexExistente = carrito.findIndex(item => item.nombre === nombre);

            if (indexExistente !== -1) {
                carrito[indexExistente].cantidad += 1;
            } else {
                carrito.push({ nombre, precio, cantidad: 1 });
            }

            renderCarrito();
        });

        window.disminuirItem = function(index) {
            if (carrito[index].cantidad > 1) {
                carrito[index].cantidad -= 1;
            } else {
                carrito.splice(index, 1);
            }
            renderCarrito();
        }

        function renderCarrito() {
            listaArticulosContainer.innerHTML = '';
            let totalGeneral = 0;

            if (carrito.length === 0) {
                listaArticulosContainer.innerHTML = '<p style="text-align: center; color: #888; font-size: 14px; padding: 10px 0;">No hay artículos agregados</p>';
            }

            carrito.forEach((item, index) => {
                const subtotal = item.precio * item.cantidad;
                totalGeneral += subtotal;

                const row = document.createElement('div');
                row.className = 'ticket-item';
                
                const textoNombre = item.cantidad > 1 ? `${item.nombre} (x${item.cantidad})` : item.nombre;

                row.innerHTML = `
                    <span>${textoNombre}</span>
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <span>${subtotal}$</span>
                        <button type="button" onclick="disminuirItem(${index})" class="btn-delete" title="Quitar uno">×</button>
                    </div>
                `;
                listaArticulosContainer.appendChild(row);
            });

            totalMontoElem.textContent = totalGeneral + '$';
            
            const puntosAcumulables = Math.floor(totalGeneral * 0.05);
            if (!checkPagarPuntos.checked) {
                infoPuntosTexto.innerHTML = `Con la compra obtendrás <strong style="color: #E31C23;">${puntosAcumulables} puntos</strong> nuevos.`;
            }
        }

        correoCliente.addEventListener('blur', async () => {
            const correo = correoCliente.value.trim();
            if (!correo) {
                infoPuntosTexto.innerHTML = 'Ingresa un correo registrado para ver tus puntos disponibles.';
                puntosDisponiblesCliente = 0;
                return;
            }

            try {
                const response = await fetch(`/api/usuario/${encodeURIComponent(correo)}`);
                const data = await response.json();

                if (data.exito) {
                    puntosDisponiblesCliente = data.usuario.puntos;
                    infoPuntosTexto.innerHTML = `Cliente: <strong>${data.usuario.nombre}</strong> | Puntos disponibles: <strong style="color: #27ae60;">${data.usuario.puntos} pts</strong>`;
                } else {
                    puntosDisponiblesCliente = 0;
                    infoPuntosTexto.innerHTML = `<span style="color: #c0392b;">Correo no registrado en el sistema de puntos.</span>`;
                }
            } catch (err) {
                console.error('Error al consultar puntos:', err);
            }
        });

        btnTerminarCompra.addEventListener('click', async () => {
            if (carrito.length === 0) {
                alert('Agrega al menos un artículo a la compra.');
                return;
            }

            const totalGeneral = carrito.reduce((sum, item) => sum + (item.precio * item.cantidad), 0);
            const correo = correoCliente.value.trim();
            const usarPuntos = checkPagarPuntos.checked;

            let tipoAccion = 'acumular';
            let puntosAGastar = 0;

            if (usarPuntos) {
                tipoAccion = 'gastar';
                puntosAGastar = totalGeneral; // 1 pt = $1
            }

            try {
                const response = await fetch('/api/compras', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        correo: correo !== '' ? correo : null, 
                        tipoAccion: tipoAccion, 
                        montoTotal: totalGeneral, 
                        puntosAGastar: puntosAGastar 
                    })
                });

                const resultado = await response.json();

                if (response.ok && resultado.exito) {
                    alert(`✅ ${resultado.mensaje}`);
                    carrito = [];
                    correoCliente.value = '';
                    checkPagarPuntos.checked = false;
                    puntosDisponiblesCliente = 0;
                    renderCarrito();
                } else {
                    alert(` Error: ${resultado.mensaje}`);
                }
            } catch (error) {
                console.error('Error en la red:', error);
                alert('Hubo un error al procesar la compra en el servidor.');
            }
        });
    </script>

</body>
</html>
